<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Análisis Causa Raíz - Grupo 7</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #f4f6f9; color: #333; }
.navbar {
  background: #1F4E79; color: white; padding: 12px 30px;
  display: flex; align-items: center; justify-content: space-between;
}
.navbar h1 { font-size: 16px; }
.navbar nav a {
  color: white; text-decoration: none; margin-left: 20px;
  font-size: 14px; padding: 6px 12px; border-radius: 4px;
  transition: background 0.2s;
}
.navbar nav a:hover { background: #2E75B6; }
.container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
.card {
  background: white; border-radius: 8px; padding: 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px;
}
.card h2 { color: #1F4E79; margin-bottom: 16px; border-bottom: 2px solid #BDD7EE; padding-bottom: 8px; }
.stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 24px; }
.stat { background: #1F4E79; color: white; padding: 20px; border-radius: 8px; text-align: center; }
.stat .numero { font-size: 36px; font-weight: bold; }
.stat .label { font-size: 13px; opacity: 0.85; margin-top: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { background: #1F4E79; color: white; padding: 10px 12px; text-align: left; }
td { padding: 9px 12px; border-bottom: 1px solid #eee; }
tr:nth-child(even) { background: #f8f9fa; }
.btn {
  display: inline-block; padding: 8px 16px; border-radius: 5px;
  text-decoration: none; font-size: 13px; cursor: pointer;
  border: none; font-family: Arial;
}
.btn-primary { background: #1F4E79; color: white; }
.btn-primary:hover { background: #2E75B6; }
.btn-success { background: #375623; color: white; }
.badge {
  display: inline-block; padding: 3px 8px; border-radius: 12px;
  font-size: 12px; font-weight: bold;
}
.badge-fatal { background: #c0392b; color: white; }
.badge-grave { background: #e67e22; color: white; }
.badge-herido { background: #f39c12; color: #333; }
footer { text-align: center; padding: 20px; color: #888; font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<div class="navbar">
  <h1>🔍 Sistema de Análisis de Causa Raíz — Motociclistas Colombia</h1>
  <nav>
    <a href="/">Inicio</a>
    <a href="/encuesta">Nueva Encuesta</a>
    <a href="/dashboard">Dashboard</a>
  </nav>
</div>
<div class="container">
{% block content %}{% endblock %}
</div>
<footer>Grupo 7 · Universidad INCCA de Colombia · Ingeniería de Sistemas · 2026</footer>
</body>
</html>
